server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Shell: always revalidate so deploys pick up new chunk hashes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Hashed Vite assets: long cache; missing file must 404 (not SPA HTML).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
