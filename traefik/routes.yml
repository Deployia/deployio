http:
  routers:
    # Landing page fallback for undefined subdomains
    # Matches any subdomain like *.deployio.tech with lowest priority
    landing:
      rule: "HostRegexp(`[a-z0-9-]+.deployio.tech`)"
      entrypoints:
        - web
      service: landing
      priority: 1

  services:
    # Route to dedicated landing page server
    landing:
      loadBalancer:
        servers:
          - url: "http://landing-page-server:80"
