global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    useBindPortIP: false
    network: "deployio_network"
    watch: true
  file:
    filename: /etc/traefik/routes.yml
    watch: true

api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

accessLog: {}
